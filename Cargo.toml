[workspace]
members = ["kernel"]
resolver = "2"

[workspace.package]
edition = "2021"
description = "QOSAMI OS workspace with the QOSAMI Core bare-metal kernel"
license = "GPL-3.0-or-later"
version = "0.3.0-dev"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
